<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>LUCVOICE-MD PAIR | WhatsApp Pairing Portal</title>

  <meta
    name="description"
    content="Generate a WhatsApp pairing code with LUCVOICE-MD PAIR."
  >

  <meta name="theme-color" content="#10121c">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --purple: #8b5cf6;
      --purple-light: #a78bfa;
      --blue: #38bdf8;
      --cyan: #22d3ee;
      --green: #2dd4bf;

      --bg: #090a13;
      --card: rgba(20, 22, 34, 0.78);

      --border: rgba(255,255,255,0.12);
      --border-soft: rgba(255,255,255,0.07);

      --text: #e8e9f0;
      --muted: #a1a4b3;
    }

    body {
      font-family: "Inter", sans-serif;

      min-height: 100vh;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(124,58,237,.16),
          transparent 28%
        ),

        radial-gradient(
          circle at 88% 16%,
          rgba(45,212,191,.14),
          transparent 30%
        ),

        radial-gradient(
          circle at 60% 90%,
          rgba(56,189,248,.10),
          transparent 35%
        ),

        #090a13;

      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }


    /* ==============================
       PARTICLE BACKGROUND
    ============================== */

    .stars {
      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;
    }

    .star {
      position: absolute;

      width: 3px;
      height: 3px;

      background: rgba(255,255,255,.55);

      border-radius: 50%;

      box-shadow:
        0 0 7px rgba(255,255,255,.35);

      animation:
        floatStar 6s ease-in-out infinite;
    }

    @keyframes floatStar {

      0%,100% {
        transform: translateY(0);
        opacity: .25;
      }

      50% {
        transform: translateY(-18px);
        opacity: .9;
      }

    }


    /* ==============================
       MAIN WRAPPER
    ============================== */

    .app {
      position: relative;

      z-index: 2;

      width: 100%;

      min-height: 100vh;

      padding-bottom: 100px;
    }


    /* ==============================
       HEADER
    ============================== */

    .topbar {

      width: 100%;

      min-height: 96px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding:
        18px
        max(20px, calc((100% - 920px) / 2));

      background:
        rgba(12,13,22,.82);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      position: sticky;

      top: 0;

      z-index: 50;
    }

    .brand {

      display: flex;

      align-items: center;

      gap: 14px;

      text-decoration: none;
    }

    .brand-logo {

      width: 58px;
      height: 58px;

      border-radius: 20px;

      padding: 2px;

      background:
        linear-gradient(
          135deg,
          rgba(167,139,250,.9),
          rgba(34,211,238,.7),
          rgba(45,212,191,.8)
        );

      box-shadow:
        0 8px 30px rgba(124,58,237,.25);
    }

    .brand-logo img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 18px;

      background: #151724;
    }

    .brand-name {

      font-size: 21px;

      font-weight: 800;

      letter-spacing: 1px;

      color: #e7e8f0;
    }

    .brand-subtitle {

      margin-top: 4px;

      font-size: 13px;

      color: #a8abb8;

      letter-spacing: .3px;
    }


    /* ==============================
       SERVER STATUS
    ============================== */

    .server-status {

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 14px 23px;

      border-radius: 999px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.035);

      color: #bfc1cc;

      font-family:
        "JetBrains Mono",
        monospace;

      font-size: 14px;

      letter-spacing: 2px;

      white-space: nowrap;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .online-dot {

      width: 13px;
      height: 13px;

      border-radius: 50%;

      background: #34d399;

      box-shadow:
        0 0 15px rgba(52,211,153,.9);

      animation:
        pulse 1.7s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0 rgba(52,211,153,.55);
      }

      70% {
        box-shadow:
          0 0 0 10px rgba(52,211,153,0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(52,211,153,0);
      }

    }


    /* ==============================
       CONTENT
    ============================== */

    .container {

      width: min(700px, 92%);

      margin: 0 auto;

      padding-top: 28px;
    }


    /* ==============================
       GLASS PANEL
    ============================== */

    .glass-panel {

      position: relative;

      padding: 28px;

      border-radius: 30px;

      overflow: hidden;

      background:

        linear-gradient(
          135deg,
          rgba(124,58,237,.10),
          rgba(56,189,248,.05) 45%,
          rgba(45,212,191,.08)
        ),

        rgba(18,20,31,.72);

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:

        0 30px 90px rgba(0,0,0,.35),

        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }

    .glass-panel::before {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 10% 0%,
          rgba(167,139,250,.15),
          transparent 35%
        ),

        radial-gradient(
          circle at 90% 10%,
          rgba(45,212,191,.12),
          transparent 35%
        );
    }


    /* ==============================
       SECURE BADGE
    ============================== */

    .secure-badge {

      position: relative;

      z-index: 2;

      width: fit-content;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px 18px;

      margin-bottom: 28px;

      border-radius: 17px;

      background:
        rgba(10,11,20,.48);

      border:
        1px solid rgba(255,255,255,.10);

      color: #bfc1cc;

      font-family:
        "JetBrains Mono",
        monospace;

      font-size: 14px;

      letter-spacing: 1px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);
    }


    /* ==============================
       FORM
    ============================== */

    .form-section {

      position: relative;

      z-index: 2;
    }

    .form-label {

      display: block;

      margin-bottom: 12px;

      font-size: 18px;

      font-weight: 700;

      color: #e3e4ec;
    }

    .phone-wrap {

      position: relative;

      display: flex;

      align-items: center;

      min-height: 76px;

      border-radius: 24px;

      overflow: hidden;

      background:
        rgba(5,7,14,.55);

      border:
        1px solid rgba(255,255,255,.08);

      transition:
        .25s ease;
    }

    .phone-wrap:focus-within {

      border-color:
        rgba(45,212,191,.55);

      box-shadow:
        0 0 0 4px rgba(45,212,191,.06),
        0 0 30px rgba(56,189,248,.08);
    }

    .prefix {

      padding-left: 20px;

      padding-right: 14px;

      color: #d6d8e2;

      font-size: 24px;

      font-family:
        "JetBrains Mono",
        monospace;
    }

    #phoneNumber {

      width: 100%;

      height: 76px;

      border: none;

      outline: none;

      background: transparent;

      color: #f1f2f7;

      font-family:
        "JetBrains Mono",
        monospace;

      font-size: 20px;

      letter-spacing: 1px;

      padding-right: 20px;
    }

    #phoneNumber::placeholder {

      color:
        rgba(185,188,201,.55);
    }


    /* ==============================
       ERROR
    ============================== */

    .error-box {

      display: none;

      margin-top: 16px;

      padding: 16px 20px;

      border-radius: 20px;

      border:
        1px solid rgba(248,113,113,.25);

      background:
        rgba(248,113,113,.06);

      color: #d2b6bd;

      font-family:
        "JetBrains Mono",
        monospace;

      font-size: 14px;

      animation:
        shake .4s ease;
    }

    .error-box.show {
      display: block;
    }

    @keyframes shake {

      0%,100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }

    }


    /* ==============================
       SESSION TYPE
    ============================== */

    .session-title {

      margin-top: 22px;

      margin-bottom: 10px;

      font-size: 14px;

      font-weight: 700;

      color: #b7bac7;
    }

    .session-switch {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 5px;

      padding: 5px;

      border-radius: 17px;

      border:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(5,7,14,.35);
    }

    .session-btn {

      border: none;

      padding: 13px;

      border-radius: 13px;

      cursor: pointer;

      color: #8e92a0;

      background: transparent;

      font-size: 13px;

      font-weight: 700;

      transition:
        .25s ease;
    }

    .session-btn.active {

      color: white;

      background:
        linear-gradient(
          135deg,
          #7c5ce7,
          #3b9de8,
          #28c9b8
        );

      box-shadow:
        0 8px 22px rgba(56,189,248,.14);
    }


    /* ==============================
       GENERATE BUTTON
    ============================== */

    .generate-btn {

      width: 100%;

      min-height: 91px;

      margin-top: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 15px;

      border: none;

      border-radius: 28px;

      cursor: pointer;

      color: #18202a;

      font-size: 20px;

      font-weight: 800;

      letter-spacing: .3px;

      background:

        linear-gradient(
          105deg,
          #8b6cf0 0%,
          #5aa8eb 45%,
          #2ec6b7 100%
        );

      box-shadow:
        0 15px 35px rgba(66,132,220,.18);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
    }

    .generate-btn:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 20px 45px rgba(56,189,248,.28);
    }

    .generate-btn:active {

      transform:
        scale(.98);
    }

    .generate-btn:disabled {

      opacity: .65;

      cursor: not-allowed;

      transform: none;
    }

    .generate-icon {

      width: 58px;
      height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 20px;

      color: #27313d;

      background:
        rgba(255,255,255,.28);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35);
    }


    /* ==============================
       RESET BUTTON
    ============================== */

    .reset-btn {

      width: 100%;

      min-height: 61px;

      margin-top: 20px;

      border-radius: 21px;

      border:
        1px solid rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.035);

      color: #c6c8d1;

      cursor: pointer;

      font-size: 17px;

      font-weight: 700;

      transition:
        .25s ease;
    }

    .reset-btn:hover {

      background:
        rgba(255,255,255,.07);

      transform:
        translateY(-2px);
    }


    /* ==============================
       HOW TO PAIR
    ============================== */

    .how-card {

      position: relative;

      z-index: 2;

      margin-top: 24px;

      padding: 28px;

      border-radius: 30px;

      background:
        rgba(9,11,19,.48);

      border:
        1px solid rgba(255,255,255,.10);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);
    }

    .how-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 18px;
    }

    .how-title {

      display: flex;

      align-items: center;

      gap: 13px;

      font-size: 21px;

      font-weight: 800;

      color: #e7e8ef;
    }

    .how-title i {
      color: #2dd4bf;
    }

    .how-subtitle {

      color: #b3b5c0;

      font-size: 15px;
    }


    /* ==============================
       STEPS
    ============================== */

    .steps {

      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    .step {

      display: flex;

      align-items: center;

      gap: 18px;

      padding: 20px;

      min-height: 94px;

      border-radius: 26px;

      background:
        rgba(255,255,255,.025);

      border:
        1px solid rgba(255,255,255,.09);

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .step:hover {

      transform:
        translateX(4px);

      background:
        rgba(255,255,255,.045);
    }

    .step-number {

      min-width: 50px;
      height: 50px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 18px;

      color: #d9d6ff;

      font-size: 20px;

      font-family:
        "JetBrains Mono",
        monospace;

      background:
        linear-gradient(
          135deg,
          rgba(124,58,237,.35),
          rgba(99,102,241,.20)
        );

      border:
        1px solid rgba(167,139,250,.20);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .step-title {

      font-size: 18px;

      font-weight: 800;

      color: #e7e8ef;

      margin-bottom: 4px;
    }

    .step-text {

      color: #afb2bf;

      font-size: 15px;

      line-height: 1.5;
    }


    /* ==============================
       TIP
    ============================== */

    .tip-box {

      display: flex;

      align-items: flex-start;

      gap: 15px;

      margin-top: 18px;

      padding: 20px;

      border-radius: 25px;

      border:
        1px solid rgba(45,212,191,.23);

      background:
        linear-gradient(
          90deg,
          rgba(45,212,191,.12),
          rgba(56,189,248,.05)
        );
    }

    .tip-icon {

      min-width: 38px;
      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      color: #052c2b;

      background:
        #2dd4bf;
    }

    .tip-title {

      font-size: 16px;

      font-weight: 800;

      color: #d9e9e8;

      margin-bottom: 4px;
    }

    .tip-text {

      color: #b2c0c2;

      font-size: 14px;

      line-height: 1.6;
    }


    /* ==============================
       INVALID NOTICE
    ============================== */

    .notice {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-top: 18px;

      padding: 18px 20px;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.025);

      color: #c4c5ce;

      font-family:
        "JetBrains Mono",
        monospace;

      font-size: 14px;
    }


    /* ==============================
       RESULT
    ============================== */

    .result-section {

      display: none;

      position: relative;

      z-index: 5;
    }

    .result-section.show {
      display: block;
    }

    .success-icon {

      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 24px;

      color: #2dd4bf;

      font-size: 30px;

      background:
        rgba(45,212,191,.12);

      border:
        1px solid rgba(45,212,191,.25);
    }

    .result-title {

      text-align: center;

      font-size: 23px;

      font-weight: 800;
    }

    .result-desc {

      text-align: center;

      margin-top: 8px;

      color: #a9acb9;

      font-size: 14px;

      line-height: 1.6;
    }

    .code-box {

      margin-top: 25px;

      padding: 24px;

      border-radius: 24px;

      text-align: center;

      border:
        1px solid rgba(45,212,191,.18);

      background:
        rgba(5,7,14,.52);
    }

    .code-label {

      color: #9fa3b0;

      font-size: 12px;

      font-family:
        "JetBrains Mono",
        monospace;

      letter-spacing: 2px;
    }

    .code-display {

      margin-top: 13px;

      font-size: clamp(24px, 7vw, 38px);

      font-weight: 800;

      letter-spacing: 5px;

      word-break: break-word;

      background:
        linear-gradient(
          90deg,
          #a78bfa,
          #38bdf8,
          #2dd4bf
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;
    }

    .result-actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;

      margin-top: 18px;
    }

    .copy-btn,
    .new-code-btn {

      min-height: 56px;

      border-radius: 18px;

      cursor: pointer;

      font-weight: 700;

      transition:
        .2s ease;
    }

    .copy-btn {

      border: none;

      color: #13232a;

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #2dd4bf
        );
    }

    .new-code-btn {

      color: #d3d5dd;

      border:
        1px solid rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.04);
    }

    .copy-btn:hover,
    .new-code-btn:hover {

      transform:
        translateY(-2px);
    }


    /* ==============================
       BOTTOM BAR
    ============================== */

    .bottom-bar {

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding: 14px 18px 20px;

      background:
        rgba(10,11,19,.92);

      border-top:
        1px solid rgba(255,255,255,.08);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }

    .bottom-inner {

      width: min(700px, 100%);

      margin: auto;

      display: grid;

      grid-template-columns:
        1.2fr 1fr;

      gap: 16px;
    }

    .bottom-generate,
    .bottom-copy {

      min-height: 66px;

      border-radius: 22px;

      font-size: 18px;

      font-weight: 800;

      cursor: pointer;

      transition:
        .2s ease;
    }

    .bottom-generate {

      border: none;

      color: #18202a;

      background:

        linear-gradient(
          105deg,
          #8b6cf0,
          #5aa8eb,
          #2ec6b7
        );
    }

    .bottom-copy {

      color: #9296a4;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.035);
    }

    .bottom-generate:hover,
    .bottom-copy:hover {

      transform:
        translateY(-2px);
    }


    /* ==============================
       LOADING
    ============================== */

    .spinner {

      width: 21px;
      height: 21px;

      border-radius: 50%;

      border:
        3px solid rgba(0,0,0,.18);

      border-top-color:
        #17212a;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 600px) {

      .topbar {

        min-height: 80px;

        padding:
          12px
          20px;
      }

      .brand-logo {

        width: 48px;
        height: 48px;

        border-radius: 17px;
      }

      .brand-logo img {
        border-radius: 15px;
      }

      .brand-name {
        font-size: 17px;
      }

      .brand-subtitle {
        font-size: 12px;
      }

      .server-status {

        padding:
          11px
          15px;

        font-size: 11px;

        letter-spacing: 1.5px;
      }

      .online-dot {

        width: 11px;
        height: 11px;
      }

      .container {

        width: 92%;

        padding-top: 20px;
      }

      .glass-panel,
      .how-card
