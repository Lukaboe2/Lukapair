<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>✦ MAYRA-AI | Pairing Protocol</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090611;
      color: #eef2ff;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* BACKGROUND VIDEO */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      opacity: 0.28;
      filter: saturate(1.3) contrast(1.1);
    }

    /* BACKGROUND ORBS */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.28;
      z-index: -2;
      pointer-events: none;
    }

    .orb1 {
      width: 70vw;
      height: 70vw;
      top: -20vw;
      left: -20vw;
      background: radial-gradient(circle, #7c3aed, #3b0764);
    }

    .orb2 {
      width: 60vw;
      height: 60vw;
      bottom: -25vw;
      right: -15vw;
      background: radial-gradient(circle, #ec4899, #7c3aed);
    }

    .orb3 {
      width: 50vw;
      height: 50vw;
      top: 40%;
      left: 30%;
      background: radial-gradient(circle, #a855f7, #4f46e5);
      opacity: 0.14;
    }

    /* GRID */
    .overlay-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(90, 50, 150, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90, 50, 150, 0.16) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      pointer-events: none;
    }

    /* MAIN GLASS */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px;
      padding: 2.5rem 2.8rem;
      border-radius: 3.5rem;

      background: rgba(15, 10, 30, 0.58);

      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);

      border: 1px solid rgba(168, 85, 247, 0.22);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(139, 92, 246, 0.12) inset;

      transition: all 0.4s ease;
    }

    .container:hover {
      box-shadow:
        0 40px 100px rgba(88, 28, 135, 0.35),
        0 0 0 1px rgba(192, 132, 252, 0.28) inset;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;

      background:
        linear-gradient(
          135deg,
          #f3e8ff 0%,
          #c084fc 35%,
          #a855f7 65%,
          #ec4899 100%
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      filter: drop-shadow(
        0 0 30px rgba(168, 85, 247, 0.45)
      );

      margin-bottom: 0.7rem;
    }

    .header .sub {
      font-size: 1rem;
      color: #d8b4fe;

      background: rgba(80, 35, 120, 0.25);

      display: inline-block;
      padding: 0.5rem 1.8rem;

      border-radius: 60px;

      backdrop-filter: blur(5px);

      border:
        1px solid rgba(216, 180, 254, 0.12);
    }

    /* INFO CARDS */
    .info-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      flex: 1 1 200px;
      min-width: 170px;

      background: rgba(25, 15, 45, 0.65);

      backdrop-filter: blur(8px);

      border:
        1px solid rgba(168, 85, 247, 0.18);

      border-radius: 2.2rem;

      padding: 1.2rem 1.8rem;

      display: flex;
      align-items: center;
      gap: 1rem;

      transition: all 0.25s ease;

      box-shadow:
        0 8px 20px -10px rgba(0, 0, 0, 0.7);
    }

    .card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(192, 132, 252, 0.55);

      background:
        rgba(50, 25, 80, 0.75);

      box-shadow:
        0 16px 35px -8px rgba(126, 34, 206, 0.35);
    }

    .card-icon {
      width: 50px;
      height: 50px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.4rem;

      background:
        linear-gradient(
          145deg,
          #7c3aed,
          #3b0764
        );

      color: #f3e8ff;

      box-shadow:
        0 4px 18px rgba(124, 58, 237, 0.35);

      flex-shrink: 0;
    }

    .card-content h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #a78bfa;
      margin-bottom: 0.15rem;
    }

    .card-content p {
      font-size: 1.2rem;
      font-weight: 600;
      color: #faf5ff;
      word-break: break-word;
    }

    /* BUTTON GRID */
    .buttons-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));

      gap: 1.2rem;

      margin-top: 1.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      padding: 1rem 1.5rem;

      border-radius: 60px;

      font-weight: 600;
      font-size: 0.95rem;

      background:
        rgba(35, 20, 60, 0.65);

      backdrop-filter: blur(5px);

      color: #f3e8ff;

      border:
        1px solid rgba(168, 85, 247, 0.2);

      cursor: pointer;

      transition: all 0.25s ease;

      box-shadow:
        0 8px 18px -8px rgba(0, 0, 0, 0.5);

      text-decoration: none;
    }

    .btn i {
      font-size: 1.2rem;
      color: #c084fc;
    }

    .btn:hover {
      transform: translateY(-5px) scale(1.02);

      background:
        rgba(100, 40, 150, 0.55);

      border-color: #c084fc;

      box-shadow:
        0 16px 35px -10px rgba(168, 85, 247, 0.55);

      color: white;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* PRIMARY BUTTON */
    .btn-primary {
      background:
        linear-gradient(
          145deg,
          #7c3aed,
          #4c1d95
        );

      border-color: #a855f7;

      color: white;

      box-shadow:
        0 10px 28px -8px rgba(124, 58, 237, 0.65);
    }

    .btn-primary:hover {
      background:
        linear-gradient(
          145deg,
          #9333ea,
          #5b21b6
        );

      box-shadow:
        0 16px 40px -8px rgba(192, 132, 252, 0.7);
    }

    /* QR SECTION */
    .qr-section {
      margin-top: 2rem;
      text-align: center;
    }

    .qr-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 1rem 2rem;

      border-radius: 60px;

      border: 1px solid rgba(192, 132, 252, 0.4);

      background:
        linear-gradient(
          145deg,
          #7c3aed,
          #4c1d95
        );

      color: white;

      font-size: 0.95rem;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(124, 58, 237, 0.4);

      transition: all .3s ease;
    }

    .qr-button:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow:
        0 15px 40px rgba(168, 85, 247, 0.6);
    }

    .qr-button i {
      font-size: 1.2rem;
    }

    /* QR BOX */
    .qr-box {
      display: none;

      width: fit-content;

      margin: 1.5rem auto 0;

      padding: 1.2rem;

      border-radius: 2rem;

      background:
        rgba(255, 255, 255, 0.97);

      border:
        2px solid rgba(192, 132, 252, 0.55);

      box-shadow:
        0 0 35px rgba(168, 85, 247, 0.5);

      animation: qrShow .4s ease;
    }

    .qr-box.active {
      display: block;
    }

    #qrcode {
      width: 220px;
      height: 220px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 220px;
      max-height: 220px;
    }

    .qr-title {
      margin-top: 1rem;

      color: #6d28d9;

      font-size: 0.85rem;

      font-weight: 800;

      letter-spacing: 0.08em;
    }

    .qr-url {
      margin-top: 0.35rem;

      color: #7e22ce;

      font-size: 0.7rem;

      max-width: 220px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    @keyframes qrShow {
      from {
        opacity: 0;
        transform: scale(.8) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* FOOTER */
    .footer {
      text-align: center;

      margin-top: 3rem;
      padding-top: 1.5rem;

      border-top:
        1px solid rgba(168, 85, 247, 0.12);

      color: #a78bfa;

      font-size: 0.82rem;
    }

    .footer span {
      background:
        linear-gradient(
          135deg,
          #c084fc,
          #f472b6
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      font-weight: 700;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {

      .container {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem;
      }

      .header h1 {
        font-size: 2.6rem;
      }

      .card {
        min-width: 140px;
        padding: 1rem 1.2rem;
      }

      .btn {
        font-size: 0.85rem;
        padding: 0.95rem 1rem;
      }

    }

    @media (max-width: 480px) {

      body {
        padding: 0.8rem;
      }

      .header h1 {
        font-size: 2.1rem;
      }

      .info-cards {
        gap: 0.8rem;
      }

      .card {
        flex: 1 1 100%;
      }

      .header .sub {
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
      }

      #qrcode {
        width: 200px;
        height: 200px;
      }

      #qrcode img,
      #qrcode canvas {
        max-width: 200px;
        max-height: 200px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND VIDEO -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source
      src="https://assets.mixkit.co/videos/preview/mixkit-abstract-digital-waves-9885-large.mp4"
      type="video/mp4">
  </video>

  <!-- BACKGROUND EFFECTS -->
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
  <div class="overlay-grid"></div>


  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <h1>✦ MAYRA-AI</h1>

      <div class="sub">
        <i class="fas fa-robot"
           style="margin-right:10px; opacity:0.8;">
        </i>

        WhatsApp Bot · Pairing Protocol
      </div>

    </div>


    <!-- INFO CARDS -->
    <div class="info-cards">

      <div class="card">

        <div class="card-icon">
          <i class="fas fa-microchip"></i>
        </div>

        <div class="card-content">
          <h3>system</h3>
          <p>ONLINE</p>
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          <i class="fas fa-signal"></i>
        </div>

        <div class="card-content">
          <h3>network</h3>
          <p id="network-type">ONLINE</p>
        </div>

      </div>


      <div class="card">

        <div class="card-icon">
          <i class="fas fa-shield-halved"></i>
        </div>

        <div class="card-content">
          <h3>status</h3>
          <p>SECURE</p>
        </div>

      </div>

    </div>


    <!-- BUTTONS -->
    <div class="buttons-grid">

      <button
        onclick="window.open('https://github.com/Mayrabrand','_blank')"
        class="btn btn-primary">

        <i class="fab fa-github"></i>
        FOLLOW DEV

      </button>


      <button
        onclick="window.location.href='/pair'"
        class="btn btn-primary">

        <i class="fas fa-link"></i>
        GET SESSION

      </button>


      <button
        onclick="window.open('https://github.com/Mayrabrand/MAYRA-AI','_blank')"
        class="btn">

        <i class="fas fa-code-branch"></i>
        REPOSITORY

      </button>


      <button
        onclick="window.open('https://wa.me/255768619068','_blank')"
        class="btn">

        <i class="fab fa-whatsapp"></i>
        CONTACT DEV

      </button>


      <button
        onclick="window.open('https://dashboard.heroku.com/new?template=https://github.com/Mayrabrand/MAYRA-AI','_blank')"
        class="btn btn-primary">

        <i class="fas fa-cloud-arrow-up"></i>
        DEPLOY HEROKU

      </button>

    </div>


    <!-- QR CODE -->
    <div class="qr-section">

      <button
        class="qr-button"
        onclick="toggleQR()">

        <i class="fas fa-qrcode"></i>

        SHOW QR CODE

      </button>


      <div
        class="qr-box"
        id="qrBox">

        <div id="qrcode"></div>

        <div class="qr-title">
          SCAN TO GET SESSION
        </div>

        <div
          class="qr-url"
          id="qrUrl">
        </div>

      </div>

    </div>


    <!-- FOOTER -->
    <div class="footer">

      <span>⚡ MAYRA-AI</span>

      · Powered by

      <span>LUKA iT</span>

      · © 2026

    </div>

  </div>


  <script>

    /* NETWORK INFO */

    function updateNetwork() {

      const el =
        document.getElementById('network-type');

      if (
        navigator.connection &&
        navigator.connection.effectiveType
      ) {

        el.textContent =
          navigator.connection
            .effectiveType
            .toUpperCase();

      } else {

        el.textContent = 'ONLINE';

      }

    }

    updateNetwork();


    /* NETWORK CHANGE */

    if (
      navigator.connection
    ) {

      navigator.connection.addEventListener(
        'change',
        updateNetwork
      );

    }


    /* QR CODE */

    let qrCreated = false;

    function toggleQR() {

      const qrBox =
        document.getElementById('qrBox');

      const qr =
        document.getElementById('qrcode');

      const qrUrl =
        document.getElementById('qrUrl');

      if (!qrCreated) {

        /*
         * Automatically creates:
         * https://your-domain.com/pair
         */

        const pairURL =
          window.location.origin + '/pair';

        new QRCode(qr, {

          text: pairURL,

          width: 220,

          height: 220,

          colorDark: '#111111',

          colorLight: '#ffffff',

          correctLevel:
            QRCode.CorrectLevel.H

        });

        qrUrl.textContent =
          pairURL;

        qrCreated = true;

      }

      qrBox.classList.toggle('active');

    }


    /* PAGE GLOW */

    const container =
      document.querySelector('.container');

    setTimeout(() => {

      container.style.boxShadow =
        '0 40px 100px rgba(124,58,237,.28),' +
        '0 0 0 1px rgba(192,132,252,.22) inset';

    }, 300);

  </script>

</body>
  </html>
