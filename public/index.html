<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | DEPLOY SITE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #3b0764, #0a0a12);
      color: white;
      overflow: hidden;
    }

    /* glowing background */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(168,85,247,0.3);
      filter: blur(120px);
      border-radius: 50%;
      top: 10%;
      left: 10%;
      animation: float 6s infinite ease-in-out;
    }

    .glow2 {
      top: 60%;
      left: 60%;
      background: rgba(99,102,241,0.3);
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(40px); }
    }

    /* card */
    .card {
      position: relative;
      z-index: 10;
      width: 360px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(168,85,247,0.4);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #bb00ff;
    }

    p {
      font-size: 12px;
      color: #c9b3e6;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #bb00ff, #6a00ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    a {
      display: block;
      margin-top: 15px;
      color: #c9b3e6;
      font-size: 12px;
      text-decoration: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="glow"></div>
  <div class="glow glow2"></div>

  <div class="card">

    <h1>LUKA-AI</h1>
    <p>Deploy • Automate • Heroku System</p>

    <input id="github" type="text" placeholder="Enter GitHub username">

    <button onclick="deploy()">🚀 Deploy Now</button>

    <a href="https://github.com/lucvoice/LUKA-AI" target="_blank">
      View GitHub Repository
    </a>

    <div class="footer">
      © 2026 LUKA-AI SYSTEM
    </div>

  </div>

  <script>
    function deploy() {
      const user = document.getElementById("github").value.trim();

      if (!user) {
        alert("Please enter GitHub username");
        return;
      }

      const url = `https://heroku.com/deploy?template=https://github.com/${user}/LUKA-AI`;

      window.open(url, "_blank");
    }
  </script>

</body>
</html>
