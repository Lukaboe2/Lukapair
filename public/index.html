<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUKA-AI | PRO TECH DASHBOARD</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --neon-primary:#ff1493;
      --neon-secondary:#ff69b4;
      --neon-accent:#ff00ff;
      --cyber-blue:#ff4fd8;
      --cyber-purple:#ff1493;
      --dark-bg:#0a0a14;
      --dark-surface:rgba(16,18,27,.85);
      --glass-border:rgba(255,20,147,.25);
      --text-primary:#ffffff;
      --text-secondary:#d8b3d0;
      --grid-color:rgba(255,20,147,.1);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      font-family:'Segoe UI',system-ui,sans-serif;
      background:
      radial-gradient(ellipse at 20% 30%, rgba(255,20,147,.15) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(255,0,255,.1) 0%, transparent 40%),
      linear-gradient(135deg,#050510 0%,#0a0a1a 50%,#070714 100%);
      color:var(--text-primary);
      overflow-x:hidden;
      position:relative;
    }

    .cyber-grid{
      position:fixed;
      inset:0;
      background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
      background-size:50px 50px;
      z-index:0;
      animation:gridMove 20s linear infinite;
    }

    @keyframes gridMove{
      0%{transform:translate(0,0);}
      100%{transform:translate(50px,50px);}
    }

    .floating-elements{
      position:fixed;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }

    .float-element{
      position:absolute;
      border-radius:50%;
      opacity:.1;
      filter:blur(20px);
      animation:float 15s infinite ease-in-out;
    }

    @keyframes float{
      0%,100%{
        transform:translate(0,0) scale(1);
      }
      50%{
        transform:translate(100px,-50px) scale(1.2);
      }
    }

    .dashboard{
      position:relative;
      z-index:10;
      max-width:500px;
      margin:4% auto;
      padding:40px 35px;
      background:var(--dark-surface);
      border-radius:24px;
      border:1px solid var(--glass-border);
      backdrop-filter:blur(25px);
      box-shadow:
      0 10px 40px rgba(0,0,0,.5),
      0 0 50px rgba(255,20,147,.2);
      animation:dashboardEntrance 1.2s ease;
    }

    @keyframes dashboardEntrance{
      0%{
        opacity:0;
        transform:translateY(60px) scale(.9);
      }
      100%{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .logo-container{
      position:relative;
      width:140px;
      height:140px;
      margin:0 auto 30px;
    }

    .logo-outer-ring{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:50%;
      border:3px solid transparent;
      border-top-color:var(--neon-primary);
      border-right-color:var(--neon-secondary);
      animation:spin 8s linear infinite;
    }

    .logo-inner-ring{
      position:absolute;
      width:90%;
      height:90%;
      top:5%;
      left:5%;
      border-radius:50%;
      border:2px solid transparent;
      border-bottom-color:var(--neon-accent);
      border-left-color:var(--cyber-blue);
      animation:spinReverse 6s linear infinite;
    }

    .logo-image{
      position:absolute;
      width:75%;
      height:75%;
      top:12.5%;
      left:12.5%;
      border-radius:50%;
      background:url('https://files.catbox.moe/36vahk.png') center/cover no-repeat;
      border:2px solid rgba(255,255,255,.1);
      box-shadow:
      0 0 30px rgba(255,20,147,.4),
      0 0 60px rgba(255,0,255,.2);
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    @keyframes spinReverse{
      100%{
        transform:rotate(-360deg);
      }
    }

    .title-container{
      margin-bottom:40px;
      text-align:center;
    }

    .main-title{
      font-size:2.8rem;
      font-weight:900;
      background:linear-gradient(
      90deg,
      var(--neon-primary),
      var(--neon-secondary),
      var(--neon-accent)
      );
      -webkit-background-clip:text;
      color:transparent;
      text-shadow:0 0 30px rgba(255,20,147,.5);
      margin-bottom:8px;
    }

    .subtitle{
      font-size:1rem;
      color:var(--text-secondary);
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .buttons-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:18px;
      margin-bottom:35px;
    }

    .tech-button{
      position:relative;
      padding:20px 15px;
      background:rgba(20,22,35,.7);
      border-radius:16px;
      border:1px solid rgba(255,20,147,.15);
      color:var(--text-primary);
      text-decoration:none;
      font-weight:600;
      transition:.4s;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      overflow:hidden;
    }

    .tech-button:hover{
      transform:translateY(-5px) scale(1.03);
      border-color:var(--neon-primary);
      box-shadow:
      0 10px 25px rgba(255,20,147,.3),
      0 0 30px rgba(255,0,255,.2);
    }

    .button-icon{
      font-size:1.8rem;
      background:linear-gradient(135deg,var(--neon-primary),var(--cyber-blue));
      -webkit-background-clip:text;
      color:transparent;
    }

    .button-label{
      font-size:.9rem;
      color:var(--text-secondary);
    }

    .status-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:rgba(10,12,20,.8);
      border-radius:12px;
      margin-top:25px;
      border:1px solid rgba(255,20,147,.1);
    }

    .status-item{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .status-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--neon-primary);
      box-shadow:0 0 10px var(--neon-primary);
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:1;}
      50%{opacity:.5;}
    }

    .footer{
      text-align:center;
      margin-top:30px;
      color:var(--text-secondary);
      font-size:.85rem;
    }

    .copyright{
      color:var(--neon-primary);
      font-weight:600;
      margin-bottom:5px;
    }

    @media(max-width:550px){
      .dashboard{
        margin:10% 20px;
        padding:30px 25px;
      }

      .buttons-grid{
        grid-template-columns:1fr;
      }

      .main-title{
        font-size:2.2rem;
      }
    }
  </style>
</head>

<body>

<div class="cyber-grid"></div>

<div class="floating-elements" id="floatingElements"></div>

<div class="dashboard">

  <div class="logo-container">
    <div class="logo-outer-ring"></div>
    <div class="logo-inner-ring"></div>
    <div class="logo-image"></div>
  </div>

  <div class="title-container">
    <h1 class="main-title">LUKA-AI</h1>
    <div class="subtitle">LUKA AI DASHBOARD</div>
  </div>

  <div class="buttons-grid">

    <a href="/qr" class="tech-button" target="_blank">
      <i class="fas fa-qrcode button-icon"></i>
      <span>QR CODE</span>
      <div class="button-label">Secure Login</div>
    </a>

    <a href="/pair" class="tech-button" target="_blank">
      <i class="fas fa-link button-icon"></i>
      <span>PAIRING CODE</span>
      <div class="button-label">Device Sync</div>
    </a>

    <a href="https://whatsapp.com/" class="tech-button" target="_blank">
      <i class="fab fa-whatsapp button-icon"></i>
      <span>WHATSAPP</span>
      <div class="button-label">Community</div>
    </a>

    <a href="https://github.com/lucvoice/LUKA-AI" class="tech-button" target="_blank">
      <i class="fab fa-github button-icon"></i>
      <span>GITHUB</span>
      <div class="button-label">Repository</div>
    </a>

  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="status-dot"></div>
      <div>System Online</div>
    </div>

    <div class="status-item">
      <div>v3.1.0 PRO</div>
    </div>

    <div class="status-item">
      <div>24/7 Active</div>
    </div>
  </div>

  <div class="footer">
    <div class="copyright">
      &copy; <span id="currentYear"></span> LUKA-AI TECH
    </div>
    <div>Advanced WhatsApp Bot Framework</div>
  </div>

</div>

<script>
document.getElementById('currentYear').textContent =
new Date().getFullYear();

const floatingContainer =
document.getElementById('floatingElements');

for(let i=0;i<15;i++){

  const element=document.createElement('div');

  element.className='float-element';

  const size=Math.random()*100+50;

  element.style.width=`${size}px`;
  element.style.height=`${size}px`;
  element.style.left=`${Math.random()*100}%`;
  element.style.top=`${Math.random()*100}%`;

  element.style.background=
  i%2===0 ? 'var(--neon-primary)'
  : 'var(--neon-accent)';

  element.style.animationDelay=
  `${Math.random()*5}s`;

  floatingContainer.appendChild(element);
}
</script>

</body>
</html>
