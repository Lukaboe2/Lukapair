<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LUKA-AI | FUTURE DASHBOARD</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --primary:#00f0ff;
  --secondary:#7b2fff;
  --accent:#ff00d4;
  --bg:#050510;
  --glass:rgba(255,255,255,0.05);
  --text:#ffffff;
  --muted:#b0b0d0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:'Segoe UI',sans-serif;
  background:
    radial-gradient(circle at top left,#0b2cff33,transparent 35%),
    radial-gradient(circle at bottom right,#ff00d433,transparent 35%),
    linear-gradient(135deg,#04040d,#09091a,#060611);
  color:var(--text);
  position:relative;
}

/* Animated Grid */
.grid{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 18s linear infinite;
  z-index:0;
}

@keyframes gridMove{
  100%{
    transform:translate(40px,40px);
  }
}

/* Floating Lights */
.lights span{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:.25;
  animation:float 15s infinite ease-in-out;
}

.lights span:nth-child(1){
  width:220px;
  height:220px;
  background:#00f0ff;
  top:10%;
  left:5%;
}

.lights span:nth-child(2){
  width:260px;
  height:260px;
  background:#7b2fff;
  bottom:10%;
  right:5%;
}

.lights span:nth-child(3){
  width:180px;
  height:180px;
  background:#ff00d4;
  top:50%;
  left:45%;
}

@keyframes float{
  50%{
    transform:translateY(-40px) scale(1.1);
  }
}

/* Main Box */
.dashboard{
  position:relative;
  z-index:10;
  width:90%;
  max-width:520px;
  margin:40px auto;
  padding:40px 30px;
  border-radius:28px;
  background:rgba(12,12,25,0.78);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(25px);
  box-shadow:
    0 0 40px rgba(0,240,255,0.15),
    0 0 80px rgba(123,47,255,0.15);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* Logo */
.logo-box{
  position:relative;
  width:150px;
  height:150px;
  margin:auto;
  margin-bottom:30px;
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid transparent;
}

.ring1{
  border-top-color:var(--primary);
  border-left-color:var(--secondary);
  animation:spin 8s linear infinite;
}

.ring2{
  inset:10px;
  border-bottom-color:var(--accent);
  border-right-color:var(--primary);
  animation:spinReverse 5s linear infinite;
}

.logo{
  position:absolute;
  inset:20px;
  border-radius:50%;
  background:url('https://files.catbox.moe/1l02sd.png') center/cover;
  box-shadow:
    0 0 30px rgba(0,240,255,.4),
    0 0 60px rgba(255,0,212,.2);
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

@keyframes spinReverse{
  100%{
    transform:rotate(-360deg);
  }
}

/* Title */
.title{
  text-align:center;
  margin-bottom:35px;
}

.title h1{
  font-size:3rem;
  font-weight:900;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;
  color:transparent;
  letter-spacing:2px;
}

.title p{
  margin-top:8px;
  color:var(--muted);
  letter-spacing:4px;
  font-size:.9rem;
}

/* Buttons */
.buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.btn{
  position:relative;
  padding:22px 15px;
  text-decoration:none;
  color:white;
  border-radius:18px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  overflow:hidden;
  transition:.4s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  backdrop-filter:blur(15px);
}

.btn i{
  font-size:1.8rem;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;
  color:transparent;
}

.btn span{
  font-weight:700;
}

.btn small{
  color:var(--muted);
}

.btn:hover{
  transform:translateY(-5px) scale(1.03);
  border-color:var(--primary);
  box-shadow:
    0 0 25px rgba(0,240,255,.25),
    0 0 45px rgba(255,0,212,.15);
}

/* Status */
.status{
  margin-top:30px;
  padding:15px 20px;
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid rgba(255,255,255,0.05);
}

.live{
  display:flex;
  align-items:center;
  gap:10px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ff73;
  box-shadow:0 0 12px #00ff73;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    opacity:.4;
  }
}

/* Footer */
.footer{
  text-align:center;
  margin-top:30px;
  color:var(--muted);
  font-size:.85rem;
}

.footer strong{
  color:var(--primary);
}

/* Mobile */
@media(max-width:600px){
  .buttons{
    grid-template-columns:1fr;
  }

  .title h1{
    font-size:2.3rem;
  }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="lights">
  <span></span>
  <span></span>
  <span></span>
</div>

<div class="dashboard">

  <div class="logo-box">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="logo"></div>
  </div>

  <div class="title">
    <h1>LUKA-AI</h1>
    <p>ADVANCED AI DASHBOARD</p>
  </div>

  <div class="buttons">

    <a href="/qr" class="btn">
      <i class="fas fa-qrcode"></i>
      <span>QR CODE</span>
      <small>Secure Login</small>
    </a>

    <a href="/pair" class="btn">
      <i class="fas fa-link"></i>
      <span>PAIR CODE</span>
      <small>Fast Pairing</small>
    </a>

    <a href="https://whatsapp.com" class="btn">
      <i class="fab fa-whatsapp"></i>
      <span>WHATSAPP</span>
      <small>Community</small>
    </a>

    <a href="https://github.com" class="btn">
      <i class="fab fa-github"></i>
      <span>GITHUB</span>
      <small>Repository</small>
    </a>

  </div>

  <div class="status">
    <div class="live">
      <div class="dot"></div>
      <span>System Online</span>
    </div>

    <div>v5.0 AI</div>
  </div>

  <div class="footer">
    <strong>© 2026 LUKA-AI</strong><br>
    Ultra Modern WhatsApp Bot System
  </div>

</div>

</body>
</html>
